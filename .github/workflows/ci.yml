name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @velora/types build

      - name: Build client
        run: pnpm --filter @velora/client build

      - name: Test server
        run: pnpm --filter @velora/server test
        env:
          NODE_ENV: test

      - name: Build server
        run: pnpm --filter @velora/server build
